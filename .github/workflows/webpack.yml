name: 打包部署

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-latest

    # 授予工作流写入权限
    permissions:
      contents: write
      pages: write
      id-token: write

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # PR 合并时，checkout 目标分支（dev）
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref || github.ref }}
        # 使用完整历史记录，确保可以推送
        fetch-depth: 0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install --legacy-peer-deps
        npm run clean
        npm run lint:fix
        npm run build
    - name: Deploy
      # 在 push 事件或 PR 合并时部署
      if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        # 确保可以强制推送（如果需要）
        force_orphan: false
